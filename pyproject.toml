[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tempo-ai"
version = "0.1.0"
description = "Tempo: an agent that decides when to service each machine in a factory fleet."
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["tempo*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
